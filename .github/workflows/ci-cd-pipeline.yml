name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch tags
        run: git fetch --tags || true

      - name: Get last tag
        id: last
        run: |
          LAST=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$LAST" >> $GITHUB_OUTPUT

      - name: Compute version
        id: ver
        run: |
          LAST="${{ steps.last.outputs.tag }}"
          
          if [ -z "$LAST" ]; then
            BASE="0.0.0"
            RANGE="HEAD"
          else
            BASE=${LAST#v}
            RANGE="${LAST}..HEAD"
          fi
          
          IFS='.' read MAJOR MINOR PATCH <<< "$BASE"
          
          COMMITS=$(git log $RANGE --pretty=format:"%s")
          
          if echo "$COMMITS" | grep -q "!:"; then
            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0
          elif echo "$COMMITS" | grep -q "^feat"; then
            MINOR=$((MINOR+1))
            PATCH=0
          elif echo "$COMMITS" | grep -q "^fix"; then
            PATCH=$((PATCH+1))
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          NEW="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Update version files and create tag
        if: steps.ver.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          sed -i "s/Bundle-Version:.*/Bundle-Version: $VERSION.qualifier/" META-INF/MANIFEST.MF
          sed -i "s/<version>.*-SNAPSHOT/<version>$VERSION-SNAPSHOT/" pom.xml
          
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add META-INF/MANIFEST.MF pom.xml
          git commit -m "chore: bump version to $VERSION-SNAPSHOT" || echo "No changes to commit"
          git push
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi

  build:
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.version.outputs.version }}
      jar-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B -U

      - name: Rename JAR
        id: artifact
        run: |
          ORIGINAL_JAR=$(ls target/*.jar | grep -v tests | head -1)
          VERSION="${{ needs.version.outputs.version }}"
          NEW_NAME="com.deepseek.plugin-$VERSION.jar"
          cp "$ORIGINAL_JAR" "target/$NEW_NAME"
          echo "name=$NEW_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-jar
          path: target/${{ steps.artifact.outputs.name }}

  javadoc:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Sync MANIFEST.MF with version
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s/Bundle-Version:.*/Bundle-Version: $VERSION.qualifier/" META-INF/MANIFEST.MF
          sed -i "/<artifactId>com.deepseek.plugin<\/artifactId>/,/<\/version>/ s|<version>.*</version>|<version>$VERSION-SNAPSHOT</version>|" pom.xml

      - name: Generate Javadoc
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          mvn javadoc:javadoc
          if [ -f "target/site/apidocs/index.html" ]; then
            sed -i "s|<title>.*</title>|<title>com.deepseek.plugin $VERSION API</title>|" target/site/apidocs/index.html
            sed -i "s|<meta name=\"title\" content=\".*\">|<meta name=\"title\" content=\"com.deepseek.plugin $VERSION API\">|" target/site/apidocs/index.html
            if ! grep -q "<title>" target/site/apidocs/index.html; then
              sed -i "s|<head>|<head>\n<title>com.deepseek.plugin $VERSION API</title>|" target/site/apidocs/index.html
            fi
          fi

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/apidocs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-jar
          path: target/

      - name: Get changelog
        id: changelog
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "v$VERSION"^ 2>/dev/null || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s")
          else
            CHANGELOG=$(git log $PREVIOUS_TAG..v$VERSION --pretty=format:"- %s")
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Release v${{ needs.build.outputs.version }}
          body: |
            ## DeepSeek Eclipse Plugin v${{ needs.build.outputs.version }}
            
            ### Changes
            
            ${{ steps.changelog.outputs.changelog }}
            
            ### Installation
            
            1. Download the JAR file below
            2. Copy to Eclipse `dropins/` folder
            3. Restart Eclipse
            
            ### Requirements
            
            - Eclipse IDE 2025-09 or newer
            - Java 21 or newer
            - DeepSeek API key
            
            ### Documentation
            
            Javadoc: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          files: target/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}